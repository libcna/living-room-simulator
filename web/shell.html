<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141b1a">
  <title>Living Room Simulator · WebGL2</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #141b1a; color: #ecf0e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .layout { width: min(100% - 32px, 1380px); margin: auto; }
    header { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; flex-direction: column; gap: 4px; }
    .brand strong { font-size: 16px; letter-spacing: .18em; }
    .brand span { color: #9db4a5; font-size: 10px; font-weight: 700; letter-spacing: .21em; }
    .actions { display: flex; align-items: center; gap: 12px; }
    .actions button { border: 1px solid #758b7d; background: transparent; color: #e6f0e7; padding: 8px 14px; cursor: pointer; }
    .actions button:hover { background: #32443a; }
    .actions span { font-size: 12px; color: #a9bfae; }
    .stage { position: relative; background: #060909; aspect-ratio: 16 / 9; max-height: calc(100vh - 154px); margin: auto; }
    /* SDL maps pointer coordinates from this element. Keep its canvas border and padding at zero. */
    canvas { display: block; width: 100%; height: 100%; border: 0; outline: none; }
    .loading { position: absolute; inset: 0; display: grid; place-items: center; background: #17211f; z-index: 1; text-align: center; }
    .loading[hidden] { display: none; }
    .loading-inner { width: min(360px, 80%); }
    .loading-mark { display: inline-block; width: 42px; height: 42px; border: 1px solid #acc3a9; transform: rotate(45deg); margin-bottom: 25px; }
    .loading h1 { font-size: 19px; font-weight: 500; letter-spacing: .04em; }
    .loading p { color: #bed0c0; font-size: 12px; min-height: 20px; }
    progress { width: 100%; height: 5px; accent-color: #b8d3a2; }
    footer { display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: space-between; padding: 14px 0 24px; font-size: 11px; color: #b4c4b8; }
    footer strong { color: #e6ede5; font-weight: 600; }
    details { font-size: 11px; padding-bottom: 25px; color: #aec4b3; }
    summary { cursor: pointer; }
    pre { max-height: 180px; overflow: auto; background: #0b1110; padding: 14px; white-space: pre-wrap; }
    @media (max-width: 640px) { .layout { width: 100%; } header, footer, details { padding-left: 14px; padding-right: 14px; } .actions span { display: none; } .stage { max-height: none; } }
  </style>
</head>
<body>
  <div class="layout">
    <header>
      <div class="brand"><strong>LIVING ROOM</strong><span>ORIGINAL C++ SIMULATOR · WEBGL2</span></div>
      <div class="actions"><span id="state">Loading</span><button id="fullscreen" type="button">Fullscreen</button></div>
    </header>
    <main class="stage">
      <canvas id="canvas" width="960" height="540" tabindex="0" aria-label="Living Room Simulator"></canvas>
      <div id="loading" class="loading" role="status">
        <div class="loading-inner"><span class="loading-mark" aria-hidden="true"></span><h1>Preparing the room</h1><p id="loading-text">Downloading the app and models…</p><progress id="progress" value="0" max="100" hidden></progress></div>
      </div>
    </main>
    <footer>
      <span><strong>W A S D</strong> move · <strong>arrow keys</strong> look around · <strong>1–8</strong> viewpoints</span>
      <span><strong>Page Up / Down</strong> time of day · <strong>F2</strong> weather · <strong>L</strong> lamps · <strong>T</strong> TV · <strong>F1</strong> status</span>
    </footer>
    <details><summary>Application log</summary><pre id="output"></pre></details>
  </div>
  <script>
    var canvas = document.getElementById('canvas');
    var loading = document.getElementById('loading');
    var loadingText = document.getElementById('loading-text');
    var progress = document.getElementById('progress');
    var state = document.getElementById('state');
    var output = document.getElementById('output');
    function logLine(text) {
      output.textContent += text + '\n';
      output.scrollTop = output.scrollHeight;
    }
    var Module = {
      canvas: canvas,
      arguments: ['--width', '960', '--height', '540', '--texture-cache', 'off',
                  '--texture-size', '256', '--model-texture-size', '512',
                  '--probe-size', '32', '--shadow-quality', '1'],
      print: function () { var text = Array.from(arguments).join(' '); console.log(text); logLine(text); },
      printErr: function () { var text = Array.from(arguments).join(' '); console.error(text); logLine(text); },
      setStatus: function (text) {
        var match = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
        if (match) { progress.hidden = false; progress.value = Number(match[1]); progress.max = Number(match[2]); }
        else { progress.hidden = true; }
        if (text) loadingText.textContent = text;
      },
      monitorRunDependencies: function (remaining) {
        this.totalDependencies = Math.max(this.totalDependencies || 0, remaining);
        if (remaining) this.setStatus('Preparing data (' + (this.totalDependencies - remaining) + '/' + this.totalDependencies + ')');
      },
      roomReady: function () {
        loading.hidden = true;
        state.textContent = 'Scene ready';
        canvas.focus();
      },
      onAbort: function (reason) {
        loadingText.textContent = 'Failed to start: ' + reason;
        state.textContent = 'Error';
      }
    };
    canvas.addEventListener('click', function () { canvas.focus(); });
    canvas.addEventListener('webglcontextlost', function (event) {
      event.preventDefault();
      loading.hidden = false;
      loadingText.textContent = 'WebGL context lost. Reload the page.';
    });
    window.addEventListener('error', function (event) {
      logLine('JavaScript: ' + event.message);
      state.textContent = 'Error';
    });
    window.addEventListener('unhandledrejection', function (event) {
      logLine('JavaScript promise: ' + String(event.reason));
      state.textContent = 'Error';
    });
    document.getElementById('fullscreen').addEventListener('click', function () {
      if (Module.requestFullscreen) Module.requestFullscreen(false, true);
      else if (canvas.requestFullscreen) canvas.requestFullscreen();
      canvas.focus();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>

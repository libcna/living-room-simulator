name: Native build and tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ git xvfb libxss-dev libxkbcommon-dev \
            wayland-protocols libwayland-dev libdecor-0-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libzstd-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxfixes-dev \
            libxtst-dev libxt-dev libxv-dev libxxf86vm-dev libpulse-dev libasound2-dev \
            libdrm-dev libgbm-dev
      - name: Fetch locked dependencies
        run: scripts/fetch-dependencies.sh
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Unit tests
        run: ctest --preset unit
